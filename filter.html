<div style="display:flex; gap:12px; align-items:flex-start; padding:1rem 0; font-family:var(--font-sans);">

  <div style="position:relative; width:220px;">
    <button style="width:100%; display:flex; justify-content:space-between; align-items:center; height:36px; padding:0 12px; background:var(--surface-2); border:0.5px solid var(--border-strong); border-radius:var(--radius); font-size:14px; color:var(--text-primary);">
      <span>3 kategorier valgt</span>
      <i class="ti ti-chevron-down" style="font-size:16px; color:var(--text-secondary);" aria-hidden="true"></i>
    </button>

    <div style="margin-top:4px; background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-popover); padding:6px;">
      <div style="display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; background:var(--fill-ghost-hover);">
        <input type="checkbox" checked style="accent-color:var(--fill-accent);"><span style="font-size:14px;">Nyheter</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:6px 8px;">
        <input type="checkbox" style="accent-color:var(--fill-accent);"><span style="font-size:14px;">Sport</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; background:var(--fill-ghost-hover);">
        <input type="checkbox" checked style="accent-color:var(--fill-accent);"><span style="font-size:14px;">Økonomi</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:6px 8px;">
        <input type="checkbox" style="accent-color:var(--fill-accent);"><span style="font-size:14px;">Kultur</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; background:var(--fill-ghost-hover);">
        <input type="checkbox" checked style="accent-color:var(--fill-accent);"><span style="font-size:14px;">Teknologi</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:6px 8px;">
        <input type="checkbox" style="accent-color:var(--fill-accent);"><span style="font-size:14px;">Reise</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:6px 8px;">
        <input type="checkbox" style="accent-color:var(--fill-accent);"><span style="font-size:14px;">Mat</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:6px 8px;">
        <input type="checkbox" style="accent-color:var(--fill-accent);"><span style="font-size:14px;">Meninger</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px; padding:6px 8px;">
        <input type="checkbox" style="accent-color:var(--fill-accent);"><span style="font-size:14px;">Livsstil</span>
      </div>
    </div>
  </div>

  <div style="position:relative; width:260px;">
    <div style="position:relative;">
      <i class="ti ti-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text-muted);" aria-hidden="true"></i>
      <input type="text" value="tek" placeholder="Søk etter kategori..." style="width:100%; height:36px; padding-left:32px; background:var(--surface-2); border:0.5px solid var(--border-strong); border-radius:var(--radius); font-size:14px; color:var(--text-primary);">
    </div>

    <div style="margin-top:4px; background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-popover); overflow:hidden;">
      <div style="padding:8px 12px; font-size:14px; cursor:pointer;">Tek<span style="color:var(--text-accent);">nologi</span></div>
      <div style="padding:8px 12px; font-size:14px; border-top:0.5px solid var(--border);">Ar<span style="color:var(--text-accent);">tek</span>tur</div>
    </div>
  </div>

</div>
